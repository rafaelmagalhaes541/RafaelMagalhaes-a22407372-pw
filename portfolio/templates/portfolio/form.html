{% extends "portfolio/base.html" %}

{% block content %}

<div class="container">
    <div class="form-card">

        <h2>{{ titulo }}</h2>
        <p class="subtitle">{{ subtitulo }}</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    💾 Guardar
                </button>

                <a href="{{ voltar_url }}" class="btn-secondary">
                    ⬅ Voltar
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
