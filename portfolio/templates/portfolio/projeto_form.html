{% extends "portfolio/base.html" %}

{% block content %}

<div class="container">
    <div class="form-card">
        <h2>📁 Novo Projeto</h2>
        <p class="subtitle">Preenche os dados do projeto</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    💾 Guardar
                </button>

                <a href="{% url 'projeto' %}" class="btn-secondary">
                    ⬅ Voltar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
